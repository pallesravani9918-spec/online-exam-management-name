<!DOCTYPE html>
<html>
<head>
    <title>Student Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Exam Results</h1>

        <table>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Score</th>
                <th>Total</th>
                <th>Percentage</th>
                <th>Status</th>
            </tr>

            {% for result in results %}
            <tr>
                <td>{{ result[0] }}</td>
                <td>{{ result[1] }}</td>
                <td>{{ result[2] }}</td>
                <td>{{ result[3] }}</td>
                <td>{{ result[4] }}%</td>
                <td>{{ result[5] }}</td>
            </tr>
            {% endfor %}

        </table>

        <br>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
